name: Audit DAR public domains
on:
  push:
    branches: [launch/defeat-anime-rng]
    paths: ['.github/workflows/domain-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public domains without account credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, urllib.request, urllib.error
          from html.parser import HTMLParser
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical=[]; self.robots=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag == 'link' and a.get('rel','').lower() == 'canonical': self.canonical.append(a.get('href',''))
                  if tag == 'meta' and a.get('name','').lower() in ('robots','googlebot'): self.robots.append(a.get('content',''))
          hosts=['defeatanimerngguide.com','defeatanimerngwiki.com','anvilwiki-786.pages.dev']
          paths=['/','/dar-build.json','/robots.txt','/sitemap-index.xml','/sitemap-0.xml']
          def inspect(task):
              host,path=task; result={'host':host,'path':path}
              try:
                  req=urllib.request.Request('https://'+host+path,headers={'User-Agent':'DARGuide-OwnerAudit/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      text=r.read(400000).decode('utf-8','replace')
                      result.update(status=r.status,final_url=r.url,x_robots_tag=r.headers.get('X-Robots-Tag'))
                      if path == '/':
                          parser=Head(); parser.feed(text)
                          result.update(canonical=parser.canonical,robots=parser.robots,title=re.findall(r'<title>(.*?)</title>',text,re.S),dar_identity='DAR Guide' in text)
                      elif path.endswith('.json'): result['build']=json.loads(text)
                      else: result['body']=text[:8000]
              except Exception as e: result['error']=str(e)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              for result in pool.map(inspect,[(h,p) for h in hosts for p in paths]):
                  print('DAR_DOMAIN_AUDIT '+json.dumps(result,ensure_ascii=False),flush=True)
          PY
