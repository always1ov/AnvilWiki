name: Build and verify DAR Guide
on:
  push:
    branches: [launch/defeat-anime-rng]
  pull_request:
    paths:
      - 'launch/**'
      - 'scripts/build-defeat-rng.mjs'
      - '.github/workflows/defeat-rng-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    name: Build, audit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release script syntax
        run: |
          node --check scripts/build-defeat-rng.mjs
          node --check launch/release.mjs
          node --check launch/tools.mjs
      - name: Build and audit content, tools and SEO
        run: node scripts/build-defeat-rng.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/dar-browser --no-save playwright
          /tmp/dar-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise desktop and mobile pages
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/dar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node launch/browser-check.mjs
      - name: Save build and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-guide-build-and-screenshots
          path: |
            dist
            dar-artifacts
          retention-days: 7
  live:
    name: Verify Cloudflare production
    if: github.event_name == 'push'
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node launch/live-check.mjs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dar-guide-live-verification
          path: dar-artifacts
          retention-days: 7
