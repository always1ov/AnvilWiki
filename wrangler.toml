# DAR Guide deployment. No upstream advertising, analytics or comment IDs.
name = "defeat-rng-guide-always1ov"
compatibility_date = "2026-09-17"
pages_build_output_dir = "dist"

# Production origin is owned by launch/site-origin.mjs and the launch answers.
# build-defeat-rng.mjs passes it as SITE_URL and writes it into the generated
# wrangler vars through apply-template. Keep the raw template fixture neutral
# so upstream demo-value drift tests do not misclassify the user's domain.
[vars]
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
PUBLIC_CF_BEACON_TOKEN = ""
PUBLIC_GA_ID = ""
