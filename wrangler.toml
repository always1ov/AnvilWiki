# DAR Guide production. No upstream advertising, analytics or comment IDs.
name = "defeat-rng-guide-always1ov"
compatibility_date = "2026-09-17"
pages_build_output_dir = "dist"

# Keep the official origin stable; never use a per-deployment pages.dev URL.
# The build script also normalizes stale template/preview SITE_URL values.
[vars]
SITE_URL = "https://defeatanimerngwiki.com"
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
PUBLIC_CF_BEACON_TOKEN = ""
PUBLIC_GA_ID = ""
