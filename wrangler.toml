# Deployment preview branch. No upstream advertising, analytics or comment IDs.
name = "defeat-rng-guide-always1ov"
compatibility_date = "2026-09-17"
pages_build_output_dir = "dist"

# SITE_URL may be set in the build environment. The build script falls back
# to Cloudflare's CF_PAGES_URL, then to the proposed Pages project name.
[vars]
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
PUBLIC_CF_BEACON_TOKEN = ""
PUBLIC_GA_ID = ""
